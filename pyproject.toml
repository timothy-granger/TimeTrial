[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "timetrial"
version = "2.0.0"
description = "Cycling time trial race scoring application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov",
]
future = [
    "twilio>=9.0",
    "aiohttp>=3.9",
]

[project.scripts]
timetrial = "timetrial.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
