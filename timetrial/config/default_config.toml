[race]
timer_interval_ms = 100
start_interval_minutes = 1.0          # 60-second gaps between riders (races 2-4)
countdown_sound_trigger_seconds = 11
time_format = "hh:mm:ss.zzz"

[categories]
names = [
    "Men (P/1/2/3)",
    "Men (4/5/U)",
    "Women (P/1/2/3)",
    "Women (4/U)",
    "Masters 50+ - Men",
    "Masters 50+ - Women",
    "Masters 60+ - Men",
    "Masters 60+ - Women",
    "Masters 70+ - Men",
    "Masters 70+ - Women",
    "Merckx - Men",
    "Merckx - Women",
    "Juniors (M)",
    "Juniors (F)",
    "Hand Cycle (M)",
]

# Categories excluded from overall results
junior_categories = [
    "Juniors (M)",
    "Juniors (F)",
]

[series]
points = [5, 4, 3, 2, 1]

[display]
starter_font_rider = 75
starter_font_countdown = 400
starter_font_clock = 65
starter_font_bib = 65
race_title = "2026 Time Trial Series"                      # First line shown at top of starter display
race_subtitle = "May 28th - Race #1"                       # Second line shown below race title (empty = no subtitle)
starter_font_title = 40      # Font size for race title
logo_image = "D:/TimeTrial_Refactor/images/GreenvilleSpinnersNavyGreen.png"              # Path to PNG logo displayed on starter display right side (empty = no logo)
logo_image_left = "D:/TimeTrial_Refactor/images/vvlogo.transparent.png"                   # Path to logo displayed on starter display left side (empty = no logo)

[paths]
default_start_list = "tt-start-list.csv"
default_finish_list = "tt-finish-list.csv"
default_results = "tt-results.html"
sound_file = "D:/TimeTrial_Refactor/distro/start.m4a"
